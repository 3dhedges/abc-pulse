<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pulse: Accounts</title>
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="app">
  <!-- Pulse app, the logged-in product used by customer success managers (CSMs). -->
  <header class="nav">
    <div class="container">
      <a class="logo" href="/app"><span class="logo-mark"></span>Pulse</a>
      <nav class="nav-links">
        <a href="/app">Accounts</a>
        <a href="/">Marketing site</a>
      </nav>
      <span class="nav-spacer"></span>
      <!-- Follows the persona chosen in the demo panel (see static/js/demo-panel.js). -->
      <span class="muted" id="signed-in-as">Signed in as Dana Whitfield (CSM)</span>
    </div>
  </header>

  <main class="container app-main">
    <!-- Left: portfolio of accounts -->
    <section class="card">
      <div class="panel-title">
        <h2>Accounts</h2>
        <span class="panel-meta">
          <button class="link-btn" id="clear-filters" type="button" hidden>Clear filters</button>
          <span class="muted" id="account-count"></span>
        </span>
      </div>
      <!-- The header (sort buttons + filters) is built by app.js from its column list. -->
      <div class="table-wrap accounts-wrap">
        <table class="data" id="accounts-table">
          <thead></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <!-- Right: details for the selected account -->
    <section class="card" id="account-detail">
      <div class="panel-title">
        <h2 id="detail-name">Select an account</h2>
        <span class="pill" id="detail-plan" hidden></span>
      </div>

      <!--
        The new Account Health panel goes here in Phase 2, behind the
        `account-health-panel` flag. With the flag off, users see the
        plain usage-stats table below (the existing experience).
      -->
      <div id="health-panel-slot" hidden></div>

      <div id="usage-stats"></div>
    </section>
  </main>

  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
